<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepairCalc — демо</title>
<style>
:root {
  --bg: #f4f5f3; --surface: #fff; --ink: #1d2427; --muted: #5f6a6e; --line: #dde1de;
  --accent: #24505f; --accent-ink: #fff; --ok: #2f7d4f; --warn: #a15c00; --warn-bg: #fff4dc;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14191b; --surface: #1d2427; --ink: #e9ecea; --muted: #9aa6aa; --line: #313b3f;
    --accent: #7fb6c8; --accent-ink: #10181b; --ok: #5fbf86; --warn: #f2b51c; --warn-bg: #3a2f10; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
header h1 { margin: 0; font-size: 19px; }
.status { font-size: 13px; color: var(--muted); }
.status b.ok { color: var(--ok); } .status b.bad { color: var(--warn); }
nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
nav button { font: inherit; font-weight: 600; border: 0; background: none; color: var(--muted); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
nav button.on { background: var(--accent); color: var(--accent-ink); }
main { max-width: 1000px; margin: 0 auto; padding: 24px 20px 60px; display: grid; gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; }
h2 { margin: 0; font-size: 18px; }
h3 { margin: 0; font-size: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
input[type=number] { width: 100px; }
button.primary, button.secondary { font: inherit; font-weight: 600; border-radius: 8px; padding: 9px 16px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border: 0; }
button.secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
button.small { padding: 5px 10px; font-size: 13px; }
.progress { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; counter-reset: st; }
.progress li { font-size: 13px; color: var(--muted); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); counter-increment: st; }
.progress li::before { content: counter(st) ". "; }
.progress li.done { color: var(--ok); border-color: var(--ok); }
.progress li.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.choices button { font: inherit; text-align: left; padding: 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.choices button:hover, .choices button.on { border-color: var(--accent); }
.choices button b { display: block; }
.question { font-size: 17px; font-weight: 600; margin: 0; }
.nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; }
.summary-room { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.works { display: grid; gap: 10px; }
.works fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 4px; }
.works legend { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 0 0 2px; }
.works label { display: flex; gap: 8px; align-items: baseline; font-size: 14px; color: var(--ink); cursor: pointer; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); }
td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num { text-align: right; white-space: nowrap; }
.muted { color: var(--muted); font-size: 13px; }
.empty td { color: var(--muted); }
.total { font-size: 20px; font-weight: 700; }
.warn { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.formula { background: var(--bg); border-radius: 8px; padding: 10px 12px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
.big { font-size: 22px; font-weight: 700; }
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); margin: 2px 4px 2px 0; }
.pill.ok { color: var(--ok); border-color: var(--ok); }
.scroll { overflow-x: auto; }
[hidden] { display: none !important; }
.stage td { background: var(--bg); font-weight: 600; font-size: 13px; color: var(--muted); padding-left: 8px; }
.results { display: grid; gap: 6px; max-height: 260px; overflow-y: auto; }
.results button { text-align: left; font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
.results button.on { border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; border: 0; background: var(--surface); color: var(--muted); padding: 7px 12px; cursor: pointer; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.add-form { display: grid; gap: 10px; background: var(--bg); border-radius: 10px; padding: 12px; }
.add-form input, .add-form textarea { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.works-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 2px 12px; margin-top: 6px; font-size: 13px; }
.works-pick label { display: flex; gap: 6px; color: var(--ink); font-size: 13px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.why { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--accent); color: var(--accent); font-weight: 700; font-size: 12px; cursor: pointer; position: relative; margin-right: 6px; background: none; padding: 0; vertical-align: 1px; }
.why-pop { position: absolute; z-index: 5; left: -4px; bottom: 26px; width: 260px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-weight: 400; font-size: 13px; text-align: left; box-shadow: 0 6px 20px rgba(0,0,0,.12); }
.why-pop ul { margin: 4px 0 0; padding-left: 18px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; }
.drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(960px, 100%); background: var(--bg); z-index: 21; overflow-y: auto; padding: 20px; display: grid; gap: 14px; align-content: start; box-shadow: -8px 0 30px rgba(0,0,0,.2); }
.variants { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.variant { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 6px; align-content: start; }
.variant.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.variant h4 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.filters label.chk { display: flex; gap: 6px; align-items: center; color: var(--ink); font-size: 13px; }
.filters input[type=number] { width: 90px; }
</style>
</head>
<body>
<header>
  <h1>RepairCalc</h1>
  <span class="status" id="status">проверяю сервисы…</span>
  <nav>
    <button data-tab="calc" class="on">Калькулятор</button>
    <button data-tab="card">Карточка товара</button>
    <button data-tab="admin">Админка</button>
  </nav>
</header>

<main>
  <section data-panel="calc" class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <h2>Калькулятор ремонта</h2>
      <label>Объект
        <select id="object"><option value="apartment">Квартира</option><option value="house">Дом</option><option value="studio">Студия</option></select>
      </label>
    </div>
    <ol class="progress" id="progress"></ol>
    <div id="wizard"></div>
  </section>
  <section data-panel="calc" class="card" id="estimate-result" hidden></section>

  <section data-panel="card" class="card" hidden>
    <h2>Расчёт в карточке товара</h2>
    <label>Найти товар <input id="product-q" placeholder="например: обои, плитка, ГКЛВ" style="width:100%"></label>
    <div class="results" id="product-results"></div>
    <div id="product-info"></div>
    <div class="row" id="calc-form" hidden>
      <label>Длина, м<input type="number" id="c-len" value="4" step="0.1" min="0"></label>
      <label>Высота / ширина, м<input type="number" id="c-wid" value="2.7" step="0.1" min="0"></label>
      <label>Окна и двери, м²<input type="number" id="c-open" value="0" step="0.1" min="0"></label>
      <label>Слоёв (для краски)<input type="number" id="c-layers" value="1" min="1" max="5"></label>
      <button class="primary" id="run-calc">Посчитать</button>
    </div>
    <div id="calc-result"></div>
  </section>

  <section data-panel="admin" class="card" hidden>
    <div class="row" style="justify-content:space-between;align-items:center">
      <h2>Привязка товаров к видам работ</h2>
      <span class="row">
        <button class="secondary" id="add-toggle">+ Добавить товар</button>
        <button class="secondary" id="autobind">Привязать автоматически (ML)</button>
      </span>
    </div>
    <form id="add-form" class="add-form" hidden>
      <div class="row">
        <label style="flex:2">Название*<input name="name" required minlength="2" placeholder="Краска интерьерная моющаяся белая 2,5 л"></label>
        <label>Цена, ₽*<input name="price" type="number" min="0.01" step="0.01" required></label>
        <label>Единица<input name="unit" placeholder="шт"></label>
      </div>
      <div class="row">
        <label>Категория<input name="category" placeholder="Краски"></label>
        <label>Бренд<input name="brand"></label>
        <label>Площадь в упаковке, м²<input name="package_area" type="number" min="0" step="0.01"></label>
        <label>Штук в упаковке<input name="quantity_in_package" type="number" min="0" step="1"></label>
      </div>
      <label>Характеристики, по одной на строку «Название: значение»
        <textarea name="characteristics" rows="3" placeholder="Влагостойкость краски: да&#10;Расход материала: 0,12&#10;Литраж банки: 2,5"></textarea></label>
      <div class="row"><button class="primary" type="submit">Добавить</button><button class="secondary" type="button" id="add-cancel">Отмена</button></div>
    </form>
    <div class="row" style="justify-content:space-between">
      <div class="seg" id="admin-filter">
        <button data-status="unbound" class="on">Без привязки</button><button data-status="ml">ML</button><button data-status="confirmed">Подтверждённые</button><button data-status="all">Все</button>
      </div>
      <span class="row" style="flex:1;justify-content:flex-end"><input id="admin-q" placeholder="поиск товара" style="flex:1;max-width:320px"><button class="secondary" id="admin-search">Найти</button></span>
    </div>
    <div id="admin-stats" class="muted"></div>
    <div id="admin-msg" class="muted"></div>
    <div class="scroll"><table id="admin-table"></table></div>
  </section>
</main>

<script>
const ROOMS = {};
const ROOM_OPENINGS = {};
const T = { stages: {}, works: {}, materials: {}, renovation: {} };
const rub = v => v == null ? "—" : Number(v).toLocaleString("ru-RU", { maximumFractionDigits: 2 }) + " ₽";
const num = v => Number(v).toLocaleString("ru-RU", { maximumFractionDigits: 2 });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const opts = (map, sel) => Object.entries(map).map(([k, v]) => `<option value="${k}" ${[].concat(sel).includes(k) ? "selected" : ""}>${esc(v)}</option>`).join("");

async function api(path, options = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = body.detail;
    throw new Error(Array.isArray(d) ? d.map(x => x.msg).join("; ") : d || `Ошибка ${res.status}`);
  }
  return body;
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll("[data-panel]").forEach(p => p.hidden = p.dataset.panel !== b.dataset.tab
    || (p.id === "estimate-result" && !p.dataset.filled));
  if (b.dataset.tab === "admin") loadAdmin();
});

api("/health").then(h => {
  const llm = h.llm.ok ? `<b class="ok">подключена (${esc(h.llm.llm_model.name)})</b>` : `<b class="bad">не подключена</b>`;
  document.getElementById("status").innerHTML = `База: <b class="${h.db.ok ? "ok" : "bad"}">${h.db.ok ? "ок" : "ошибка"}</b> · Нейросеть: ${llm}`;
}).catch(() => document.getElementById("status").textContent = "сервер не отвечает");

const STEPS = ["Помещение", "Размеры", "Вид ремонта", "Работы", "Смета"];
const RENO_HINTS = {
  cosmetic: "обновить отделку: стены, пол",
  capital: "с демонтажом, черновыми и чистовыми работами",
  euro: "капитальный под ключ, дорогие материалы",
  rental: "быстро и недорого для арендаторов",
};
const W = { step: 0, room: {}, rooms: [], editing: null, options: null };
const wizard = document.getElementById("wizard");

function showStep(n) {
  W.step = n;
  document.getElementById("progress").innerHTML = STEPS.map((t, i) =>
    `<li class="${i === n ? "on" : i < n ? "done" : ""}">${t}</li>`).join("");
  [stepRoom, stepSize, stepRenovation, stepWorks, stepSummary][n]();
}

function nav(back, next, nextLabel = "Далее") {
  return `<div class="nav">${back ? `<button class="secondary" data-back>← Назад</button>` : "<span></span>"}
    ${next ? `<button class="primary" data-next>${nextLabel}</button>` : ""}</div>`;
}
function bindNav(onNext) {
  wizard.querySelector("[data-back]")?.addEventListener("click", () => showStep(W.step - 1));
  wizard.querySelector("[data-next]")?.addEventListener("click", onNext);
}

function stepRoom() {
  wizard.innerHTML = `<p class="question">Какое помещение ремонтируем?</p>
    <div class="choices">${Object.entries(ROOMS).map(([k, v]) =>
      `<button data-room="${k}" class="${W.room.room_type === k ? "on" : ""}"><b>${esc(v)}</b></button>`).join("")}</div>
    ${W.rooms.length ? nav(false, true, "К списку помещений") : ""}`;
  wizard.querySelectorAll("[data-room]").forEach(b => b.onclick = () => {
    if (W.room.room_type !== b.dataset.room) W.room.works = null;
    W.room.room_type = b.dataset.room;
    showStep(1);
  });
  bindNav(() => { W.room = {}; W.editing = null; showStep(4); });
}

function stepSize() {
  const r = W.room;
  wizard.innerHTML = `<p class="question">Размеры: ${esc(ROOMS[r.room_type])}</p>
    <div class="row">
      <label>Длина, м<input type="number" id="w-len" value="${r.length_m ?? ""}" step="0.1" min="0"></label>
      <label>Ширина, м<input type="number" id="w-wid" value="${r.width_m ?? ""}" step="0.1" min="0"></label>
      <label>Высота потолка, м<input type="number" id="w-hei" value="${r.height_m ?? 2.7}" step="0.1" min="0"></label>
      <label>Окон, шт<input type="number" id="w-win" value="${r.windows ?? (ROOM_OPENINGS[r.room_type] || [1, 1])[0]}" step="1" min="0" max="30"></label>
      <label>Дверей, шт<input type="number" id="w-door" value="${r.doors ?? (ROOM_OPENINGS[r.room_type] || [1, 1])[1]}" step="1" min="0" max="30"></label>
      <label>Влажность<select id="w-hum"><option value="">по типу комнаты</option>${opts({ low: "низкая", normal: "обычная", high: "высокая" }, r.humidity || "")}</select></label>
    </div>
    <p class="muted" id="w-area"></p>
    ${nav(true, true)}`;
  const v = id => Number(document.getElementById(id).value);
  const openings = () => v("w-win") * 2.1 + v("w-door") * 1.6;
  const area = () => {
    const ok = v("w-len") > 0 && v("w-wid") > 0 && v("w-hei") > 0;
    document.getElementById("w-area").textContent = ok
      ? `Пол ${num(v("w-len") * v("w-wid"))} м² · стены ${num(Math.max(2 * (v("w-len") + v("w-wid")) * v("w-hei") - openings(), 0))} м² (без окон и дверей; окно считаем 1,5 × 1,4 м, дверь 0,8 × 2 м)`
      : "Укажите длину, ширину и высоту";
    wizard.querySelector("[data-next]").disabled = !ok;
  };
  wizard.querySelectorAll("input").forEach(el => el.oninput = area);
  area();
  bindNav(() => {
    Object.assign(r, { length_m: v("w-len"), width_m: v("w-wid"), height_m: v("w-hei"), windows: v("w-win"), doors: v("w-door") });
    delete r.openings_area_m2;
    const hum = document.getElementById("w-hum").value;
    if (hum) r.humidity = hum; else delete r.humidity;
    showStep(2);
  });
}


function stepRenovation() {
  const r = W.room;
  wizard.innerHTML = `<p class="question">Какой ремонт: ${esc(ROOMS[r.room_type])}, ${num(r.length_m * r.width_m)} м²?</p>
    <div class="choices">${Object.entries(T.renovation).map(([k, v]) =>
      `<button data-reno="${k}" class="${r.renovation_type === k ? "on" : ""}"><b>${esc(v)}</b><span class="muted">${esc(RENO_HINTS[k] || "")}</span></button>`).join("")}</div>
    ${nav(true, false)}`;
  wizard.querySelectorAll("[data-reno]").forEach(b => b.onclick = () => {
    if (r.renovation_type !== b.dataset.reno) r.works = null;
    r.renovation_type = b.dataset.reno;
    showStep(3);
  });
  bindNav();
}

async function stepWorks() {
  const r = W.room;
  wizard.innerHTML = `<p class="muted">Загружаю список работ…</p>`;
  const o = await api(`/api/v1/works?room_type=${r.room_type}&renovation_type=${r.renovation_type}`);
  const key = w => [w.work_type, w.surface || "", (w.materials || []).join(",")].join("|");
  const chosen = r.works && new Set(r.works.map(key));
  wizard.innerHTML = `<p class="question">Какие работы нужны? ${esc(o.room_title)} · ${esc(o.renovation_title)}</p>
    <p class="muted">Отметили типичные для этого ремонта, можно изменить.</p>
    <div class="works">${o.stages.map(st => `<fieldset><legend>${esc(st.title)}</legend>${
      st.works.map(w => {
        const on = chosen ? chosen.has(key(w)) : w.default;
        return `<label><input type="checkbox" data-work="${w.work_type}" data-surface="${w.surface || ""}" data-materials="${w.materials.join(",")}" ${on ? "checked" : ""}>
          <span>${esc(w.title)} <span class="muted">${esc(w.material_titles.join(", "))}</span></span></label>`;
      }).join("")}</fieldset>`).join("")}</div>
    ${nav(true, true, "Готово")}`;
  const boxes = [...wizard.querySelectorAll("[data-work]")];
  const check = () => wizard.querySelector("[data-next]").disabled = !boxes.some(c => c.checked);
  boxes.forEach(c => c.onchange = check);
  check();
  bindNav(() => {
    r.works = boxes.filter(c => c.checked).map(c => ({
      work_type: c.dataset.work, surface: c.dataset.surface || null, materials: c.dataset.materials.split(",").filter(Boolean),
    }));
    if (W.editing === null) W.rooms.push(r); else W.rooms[W.editing] = r;
    W.room = {}; W.editing = null;
    showStep(4);
  });
}

function stepSummary() {
  wizard.innerHTML = `<p class="question">Помещения</p>
    ${W.rooms.map((r, i) => `<div class="summary-room">
      <span><b>${esc(ROOMS[r.room_type])}</b> · ${num(r.length_m)} × ${num(r.width_m)} м · ${esc(T.renovation[r.renovation_type])}
        <span class="muted"> · работ: ${r.works.length}</span></span>
      <span class="row"><button class="secondary small" data-edit="${i}">Изменить</button><button class="secondary small" data-del="${i}">✕</button></span>
    </div>`).join("") || `<p class="muted">Пока нет помещений.</p>`}
    <div class="nav"><button class="secondary" data-add>+ Добавить помещение</button>
      <button class="primary" data-calc ${W.rooms.length ? "" : "disabled"}>Рассчитать смету</button></div>`;
  wizard.querySelector("[data-add]").onclick = () => { W.room = {}; W.editing = null; showStep(0); };
  wizard.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
    W.editing = Number(b.dataset.edit);
    W.room = structuredClone(W.rooms[W.editing]);
    showStep(0);
  });
  wizard.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { W.rooms.splice(Number(b.dataset.del), 1); showStep(4); });
  wizard.querySelector("[data-calc]").onclick = () => runEstimate();
}

function roomsPayload() {
  return W.rooms.map(r => {
    const { pickMap, ...room } = r;
    return { ...room, picks: Object.values(pickMap || {}) };
  });
}

const pickKey = i => `${i.material}|${i.surface || ""}`;

function productCell(ri, i) {
  const why = (i.why || []).length
    ? `<button class="why" data-why title="Почему этот товар">!</button>` : "";
  const picked = (W.rooms[ri].pickMap || {})[pickKey(i)] ? ' <span class="pill ok">ваш выбор</span>' : "";
  return `${why}${esc(i.product.name)}${picked}
    <div><button class="link" data-change="${ri}|${i.material}|${i.surface || ""}">Изменить</button></div>`;
}

function bindEstimateButtons(r) {
  const out = document.getElementById("estimate-result");
  out.querySelectorAll("[data-why]").forEach(btn => btn.onclick = e => {
    e.stopPropagation();
    const open = btn.querySelector(".why-pop");
    out.querySelectorAll(".why-pop").forEach(x => x.remove());
    if (open) return;
    const tr = btn.closest("tr");
    const [ri, material, surface] = tr.querySelector("[data-change]").dataset.change.split("|");
    const item = r.rooms[ri].items.find(x => x.material === material && (x.surface || "") === surface);
    btn.insertAdjacentHTML("beforeend", `<div class="why-pop"><b>Почему выбран этот товар</b><ul>${
      item.why.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>`);
  });
  out.querySelectorAll("[data-change]").forEach(btn => btn.onclick = () => {
    const [ri, material, surface] = btn.dataset.change.split("|");
    const item = r.rooms[ri].items.find(x => x.material === material && (x.surface || "") === surface);
    openPicker(Number(ri), item);
  });
}
document.addEventListener("click", () => document.querySelectorAll(".why-pop").forEach(x => x.remove()));

const P = { ri: 0, item: null, offset: 0, rows: [] };
const VARIANT_TITLES = { recommended: "Рекомендуем", quality: "Самый качественный", cheapest: "Самый выгодный из подходящих" };
const FEATURES = { moisture_resistant: "влагостойкий", washable: "моющийся", wear_class: "износостойкий",
  anti_slip: "противоскользящий", frost_resistant: "морозостойкий", low_emission: "без запаха", ip_protected: "защита от брызг (IP44+)" };

function openPicker(ri, item) {
  Object.assign(P, { ri, item, offset: 0, rows: [] });
  document.body.insertAdjacentHTML("beforeend", `<div class="drawer-bg" id="picker-bg"></div>
    <aside class="drawer" id="picker">
      <div class="row" style="justify-content:space-between;align-items:center">
        <h2>${esc(item.title)}${({ floor: " · пол", wall: " · стены", ceiling: " · потолок" })[item.surface] || ""}
          <span class="muted">· ${esc(ROOMS[W.rooms[ri].room_type])}</span></h2>
        <button class="secondary small" id="picker-close">✕ Закрыть</button>
      </div>
      <div class="variants" id="picker-variants"><p class="muted">Загружаю…</p></div>
      <div class="filters">
        <label>Поиск<input id="pf-q" placeholder="название, бренд"></label>
        <label>Сортировка<select id="pf-sort">
          <option value="recommended">рекомендуемые</option><option value="quality">по качеству</option>
          <option value="price_asc">сначала дешёвые (за ед.)</option><option value="price_desc">сначала дорогие (за ед.)</option>
          <option value="name">по названию</option></select></label>
        <label>Цена от<input id="pf-min" type="number" min="0"></label>
        <label>до<input id="pf-max" type="number" min="0"></label>
        <label class="chk"><input type="checkbox" id="pf-suitable"> только подходящие</label>
        ${Object.entries(FEATURES).map(([k, v]) => `<label class="chk"><input type="checkbox" data-feature="${k}"> ${v}</label>`).join("")}
      </div>
      <div class="muted" id="picker-total"></div>
      <div class="scroll"><table id="picker-table"></table></div>
      <button class="secondary" id="picker-more" hidden>Показать ещё</button>
    </aside>`);
  const close = () => { document.getElementById("picker")?.remove(); document.getElementById("picker-bg")?.remove(); };
  document.getElementById("picker-close").onclick = close;
  document.getElementById("picker-bg").onclick = close;
  let t = null;
  document.querySelectorAll("#picker .filters input, #picker .filters select").forEach(el =>
    el.addEventListener(el.type === "checkbox" || el.tagName === "SELECT" ? "change" : "input", () => {
      clearTimeout(t); t = setTimeout(() => loadOptions(true), 300);
    }));
  document.getElementById("picker-more").onclick = () => loadOptions(false);
  loadOptions(true);
}

async function loadOptions(reset) {
  if (reset) { P.offset = 0; P.rows = []; }
  const v = id => document.getElementById(id).value;
  const body = {
    room: roomsPayload()[P.ri], material: P.item.material, surface: P.item.surface, sort: v("pf-sort"),
    q: v("pf-q") || null, price_min: v("pf-min") ? Number(v("pf-min")) : null, price_max: v("pf-max") ? Number(v("pf-max")) : null,
    suitable_only: document.getElementById("pf-suitable").checked,
    features: [...document.querySelectorAll("#picker [data-feature]:checked")].map(c => c.dataset.feature),
    limit: 30, offset: P.offset,
  };
  const o = await api("/api/v1/estimate/options", { method: "POST", body: JSON.stringify(body) });
  P.rows = P.rows.concat(o.products);
  P.offset += o.products.length;
  const current = P.item.product?.id;
  const costLine = x => x.cost != null ? `${x.packages} упак. · <b>${rub(x.cost)}</b>` : `<span class="muted">количество уточните</span>`;
  const shown = {};
  if (reset) document.getElementById("picker-variants").innerHTML = Object.entries(o.variants).map(([k, x]) => {
    const same = shown[x.product.id];
    shown[x.product.id] = shown[x.product.id] || VARIANT_TITLES[k];
    if (same) return `<div class="variant"><h4>${VARIANT_TITLES[k]}</h4>
      <div class="muted">Совпадает с «${esc(same)}»: ${k === "cheapest" ? "среди подходящих товаров дешевле за единицу нет" : "качественнее товара в подборке нет"}.</div></div>`;
    return `
    <div class="variant ${x.product.id === current ? "on" : ""}">
      <h4>${VARIANT_TITLES[k]}</h4>
      <div>${esc(x.product.name)}</div>
      <div class="muted">${rub(x.unit_price)} ${esc(x.unit_price_title.replace("₽", ""))} · качество ${x.quality_pct}%</div>
      <div>${x.features.map(f => `<span class="pill">${esc(f)}</span>`).join("")}</div>
      <div>${costLine(x)}</div>
      ${x.product.id === current ? '<span class="pill ok">сейчас в смете</span>'
        : `<button class="primary small" data-pick="${x.product.id}">Выбрать</button>`}
    </div>`;
  }).join("") || '<p class="muted">Нет подходящих товаров.</p>';
  document.getElementById("picker-total").textContent = `Найдено товаров: ${o.total}`;
  document.getElementById("picker-table").innerHTML = `
    <tr><th>Товар</th><th>Качество</th><th style="text-align:right">Цена за ед.</th><th style="text-align:right">Цена</th><th style="text-align:right">На комнату</th><th></th></tr>
    ${P.rows.map(x => `<tr>
      <td>${esc(x.product.name)}<div>${x.features.map(f => `<span class="pill">${esc(f)}</span>`).join("")}${x.suitable ? "" : ' <span class="muted">· подходит хуже</span>'}</div></td>
      <td>${x.quality_pct}%</td>
      <td class="num">${rub(x.unit_price)}<div class="muted">${esc(x.unit_price_title.replace("₽", ""))}</div></td>
      <td class="num">${rub(x.product.result_price)}</td>
      <td class="num">${costLine(x)}</td>
      <td>${x.product.id === current ? '<span class="pill ok">в смете</span>' : `<button class="secondary small" data-pick="${x.product.id}">Выбрать</button>`}</td>
    </tr>`).join("")}`;
  document.getElementById("picker-more").hidden = P.offset >= o.total;
  document.querySelectorAll("#picker [data-pick]").forEach(b => b.onclick = async () => {
    const room = W.rooms[P.ri];
    room.pickMap = { ...(room.pickMap || {}), [pickKey(P.item)]: Number(b.dataset.pick) };
    document.getElementById("picker")?.remove(); document.getElementById("picker-bg")?.remove();
    await runEstimate(true);
  });
}

async function runEstimate(keepScroll = false) {
  const out = document.getElementById("estimate-result");
  out.hidden = false; out.dataset.filled = "1";
  if (!keepScroll) out.innerHTML = `<p class="muted">Считаю…</p>`;
  try {
    const r = await api("/api/v1/estimate", { method: "POST", body: JSON.stringify({
      object_type: document.getElementById("object").value,
      renovation_type: W.rooms[0].renovation_type,
      rooms: roomsPayload(),
    }) });
    out.innerHTML = renderEstimate(r);
    document.getElementById("copy-list").onclick = () => copyList(r);
    bindEstimateButtons(r);
    if (!keepScroll) out.scrollIntoView({ behavior: "smooth" });
  } catch (e) { out.innerHTML = `<div class="warn">${esc(e.message)}</div>`; }
}

function renderEstimate(r) {
  const rooms = r.rooms.map((room, ri) => {
    let stage = null;
    const rows = room.items.map(i => {
      const head = i.stage !== stage ? `<tr class="stage"><td colspan="6">${esc(T.stages[i.stage])}</td></tr>` : "";
      stage = i.stage;
      const work = `${esc(i.title)}<div class="muted">${esc(T.works[i.work_type])}${({ floor: " · пол", wall: " · стены", ceiling: " · потолок" })[i.surface] || ""}</div>`;
      if (i.packages === 0 && !i.product) return head + `<tr class="empty"><td>${work}</td><td colspan="5">${esc(i.reason)}</td></tr>`;
      if (i.packages === 0) return head + `<tr><td>${work}</td><td>${productCell(ri, i)}<div class="muted">${esc(i.reason)}</div></td>
        <td class="num" colspan="2"><span class="muted">количество уточните</span></td>
        <td class="num">${rub(i.product.result_price)}</td><td class="num">—</td></tr>`;
      return head + `<tr><td>${work}${i.reason ? `<div class="muted">${esc(i.reason)}</div>` : ""}</td>
        <td>${productCell(ri, i)}</td>
        <td class="num">${num(i.required_amount)} ${esc(i.required_unit)}</td>
        <td class="num">${i.packages} × ${esc(i.product?.unit || "шт")}</td>
        <td class="num">${rub(i.unit_price)}</td>
        <td class="num"><b>${rub(i.cost)}</b></td></tr>`;
    }).join("");
    return `<h3>${esc(room.room.name || ROOMS[room.room.room_type])} · ${esc(T.renovation[room.room.renovation_type || r.renovation_type])} · пол ${num(room.floor_area_m2)} м², стены ${num(room.wall_area_m2)} м²</h3>
      <div class="scroll"><table>
        <tr><th>Материал / работа</th><th>Товар</th><th style="text-align:right">Нужно</th><th style="text-align:right">Купить</th><th style="text-align:right">Цена</th><th style="text-align:right">Сумма</th></tr>
        ${rows}
        <tr><td colspan="5"><b>Итого по комнате</b></td><td class="num"><b>${rub(room.subtotal)}</b></td></tr>
      </table></div>`;
  }).join("");
  const warns = r.warnings.length ? `<div class="warn">${r.warnings.map(esc).join("<br>")}</div>` : "";
  return `<h2>Смета</h2>${rooms}${warns}
    <div class="row" style="justify-content:space-between;align-items:center">
      <span class="total">Итого: ${rub(r.total)}</span>
      <span class="row"><button class="secondary" id="copy-list">Скопировать список для прораба</button><button class="primary" onclick="alert('Демо: корзину подключит магазин')">В корзину</button></span>
    </div>
    <p class="muted">Рассчитано за ${r.elapsed_ms} мс. Цены ориентировочные.</p>`;
}

function copyList(r) {
  const lines = r.rooms.flatMap(room => [`${ROOMS[room.room.room_type]}:`, ...room.items.filter(i => i.packages)
    .map(i => `  [${T.stages[i.stage]}] ${i.product.name} — ${i.packages} ${i.product.unit || "шт"}`)]);
  navigator.clipboard.writeText(lines.join("\n")).then(
    () => document.getElementById("copy-list").textContent = "Скопировано ✓",
    () => alert(lines.join("\n")));
}

let productId = null, searchTimer = null;
async function searchProducts() {
  const q = document.getElementById("product-q").value.trim();
  const list = await api(`/api/v1/products?limit=30${q ? `&q=${encodeURIComponent(q)}` : ""}`);
  const box = document.getElementById("product-results");
  box.innerHTML = list.length ? list.map(p => `<button data-id="${p.id}" class="${p.id === productId ? "on" : ""}">${esc(p.name)} — ${rub(p.result_price)}</button>`).join("")
    : `<span class="muted">ничего не найдено</span>`;
  box.querySelectorAll("button").forEach(b => b.onclick = () => showProduct(Number(b.dataset.id)));
}
document.getElementById("product-q").oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(searchProducts, 250); };

async function showProduct(id) {
  productId = id;
  document.querySelectorAll("#product-results button").forEach(b => b.classList.toggle("on", Number(b.dataset.id) === id));
  const p = await api(`/api/v1/products/${id}`);
  const chars = p.characteristics.map(c => `<span class="pill">${esc(c.name)}: ${esc(c.value)}</span>`).join("");
  const binding = p.binding ? `${esc(T.materials[p.binding.material])} → ${p.binding.work_types.map(w => esc(T.works[w])).join(", ")}` : "не привязан";
  document.getElementById("product-info").innerHTML = `
    <h3>${esc(p.name)}</h3>
    <div class="big">${rub(p.result_price)} <span class="muted">за ${esc(p.unit || "шт")}</span></div>
    <div>${chars || '<span class="muted">характеристик нет</span>'}</div>
    <div class="muted">Как понял сервис: ${Object.keys(p.specs).length ? esc(JSON.stringify(p.specs)) : "размеров не найдено"}</div>
    <div class="muted">Привязка: ${binding}</div>`;
  document.getElementById("calc-form").hidden = false;
  document.getElementById("calc-result").innerHTML = "";
}

document.getElementById("run-calc").onclick = async () => {
  const out = document.getElementById("calc-result");
  try {
    const r = await api(`/api/v1/product/${productId}/calc`, { method: "POST", body: JSON.stringify({
      length_m: Number(document.getElementById("c-len").value),
      width_m: Number(document.getElementById("c-wid").value),
      openings_area_m2: Number(document.getElementById("c-open").value || 0),
      layers: Number(document.getElementById("c-layers").value || 1),
    }) });
    out.innerHTML = `<div class="big">Нужно ${r.packages} × ${esc(r.product.unit || "шт")} — ${rub(r.total_cost)}</div>
      <div class="formula">${esc(r.formula)}</div>
      <p class="muted">Площадь ${num(r.area_m2)} м², запас ${num(r.reserve_pct)}%</p>`;

};

let adminStatus = "unbound", adminRows = [];
const flagTitles = { moisture_resistant: "влагостойкий", washable: "моющийся" };
const describe = x => `<b>${esc(T.materials[x.material])}</b><div class="muted">${x.work_types.map(w => esc(T.works[w])).join(", ") || "виды работ не указаны"}</div>`;

async function loadAdmin() {
  const q = document.getElementById("admin-q").value.trim();
  const [stats, rows] = await Promise.all([
    api("/api/v1/admin/stats"),
    api(`/api/v1/admin/products?status=${adminStatus}&limit=100${q ? `&q=${encodeURIComponent(q)}` : ""}`),
  ]);
  adminRows = rows;
  document.getElementById("admin-stats").textContent =
    `Товаров: ${stats.products_total} · подтверждено вручную: ${stats.bound_manual} · привязано ML: ${stats.bound_ml} · без привязки: ${stats.unbound} · доля автопривязки: ${Math.round(stats.auto_bound_share * 100)}%`;
  document.getElementById("admin-table").innerHTML = rows.length ? `
    <tr><th>Товар</th><th>Подсказка ML</th><th>Текущая привязка</th><th></th></tr>
    ${rows.map(r => {
      const s = r.suggestion, b = r.binding;
      const flags = Object.entries(s.flags).filter(([, v]) => v).map(([k]) => `<span class="pill">${esc(flagTitles[k] || k)}</span>`).join("");
      const bound = !b ? '<span class="muted">нет</span>'
        : `<span class="pill ${b.confirmed ? "ok" : ""}">${b.confirmed ? "✓ подтверждено" : "ML"}</span>${describe(b)}`;
      return `<tr data-id="${r.product.id}">
        <td>${esc(r.product.name)}<div class="muted">${[esc(r.category || ""), r.manual ? '<span class="pill">ручной</span>' : ""].filter(Boolean).join(" · ")}</div></td>
        <td>${describe(s)}<div class="muted">уверенность ${Math.round(s.confidence * 100)}%</div><div>${flags}</div></td>
        <td>${bound}</td>
        <td data-cell>${actionButtons(r)}</td></tr>`;
    }).join("")}` : `<tr><td class="muted">Здесь пусто.</td></tr>`;
  bindRowButtons();
}

function actionButtons(r) {
  const confirmed = r.binding && r.binding.confirmed;
  return `<div class="actions">${confirmed ? "" : '<button class="primary small" data-confirm>✓ Подтвердить</button>'}
    <button class="secondary small" data-edit>Изменить</button>
    ${r.manual ? '<button class="secondary small" data-delete title="Удалить ручной товар">Удалить</button>' : ""}</div>`;
}

function bindRowButtons() {
  document.querySelectorAll("#admin-table tr[data-id]").forEach(tr => {
    const r = adminRows.find(x => String(x.product.id) === tr.dataset.id);
    const cell = tr.querySelector("[data-cell]");
    const save = async body => {
      await api(`/api/v1/admin/products/${r.product.id}/binding`, { method: "PUT", body: JSON.stringify(body) });
      document.getElementById("admin-msg").textContent = `Сохранено: ${r.product.name}`;
      loadAdmin();
    };
    const src = r.binding || r.suggestion;
    tr.querySelector("[data-confirm]")?.addEventListener("click", () => save({
      material: src.material, work_types: src.work_types, room_types: src.room_types, flags: src.flags }));
    tr.querySelector("[data-delete]")?.addEventListener("click", async () => {
      if (!confirm(`Удалить «${r.product.name}»?`)) return;
      await api(`/api/v1/admin/products/${r.product.id}`, { method: "DELETE" });
      document.getElementById("admin-msg").textContent = `Удалён: ${r.product.name}`;
      loadAdmin();
    });
    tr.querySelector("[data-edit]").addEventListener("click", () => {
      const chosen = new Set(src.work_types);
      cell.innerHTML = `<select data-m>${opts(T.materials, src.material)}</select>
        <div class="works-pick">${Object.entries(T.works).map(([id, title]) =>
          `<label><input type="checkbox" value="${id}" ${chosen.has(id) ? "checked" : ""}>${esc(title)}</label>`).join("")}</div>
        <div class="actions" style="margin-top:6px"><button class="primary small" data-save>Сохранить</button><button class="secondary small" data-cancel>Отмена</button></div>`;
      cell.querySelector("[data-cancel]").onclick = () => { cell.innerHTML = actionButtons(r); bindRowButtons(); };
      cell.querySelector("[data-save]").onclick = () => save({
        material: cell.querySelector("[data-m]").value,
        work_types: [...cell.querySelectorAll(".works-pick input:checked")].map(c => c.value),
        room_types: src.room_types, flags: src.flags,
      });
    });
  });
}

document.querySelectorAll("#admin-filter button").forEach(b => b.onclick = () => {
  adminStatus = b.dataset.status;
  document.querySelectorAll("#admin-filter button").forEach(x => x.classList.toggle("on", x === b));
  loadAdmin();
});
document.getElementById("admin-search").onclick = loadAdmin;
document.getElementById("admin-q").addEventListener("keydown", e => { if (e.key === "Enter") loadAdmin(); });

const addForm = document.getElementById("add-form");
document.getElementById("add-toggle").onclick = () => { addForm.hidden = !addForm.hidden; };
document.getElementById("add-cancel").onclick = () => { addForm.hidden = true; };
addForm.onsubmit = async e => {
  e.preventDefault();
  const f = new FormData(addForm);
  const num = k => f.get(k) ? Number(f.get(k)) : null;
  const text = k => (f.get(k) || "").trim() || null;
  const characteristics = (f.get("characteristics") || "").split("\n").map(l => l.split(":"))
    .filter(p => p.length >= 2 && p[0].trim() && p.slice(1).join(":").trim())
    .map(p => ({ name: p[0].trim(), value: p.slice(1).join(":").trim() }));
  try {
    const row = await api("/api/v1/admin/products", { method: "POST", body: JSON.stringify({
      name: text("name"), price: num("price"), unit: text("unit"), category: text("category"), brand: text("brand"),
      package_area: num("package_area"), quantity_in_package: num("quantity_in_package"), characteristics,
    }) });
    addForm.reset(); addForm.hidden = true;
    adminStatus = "unbound";
    document.querySelectorAll("#admin-filter button").forEach(x => x.classList.toggle("on", x.dataset.status === "unbound"));
    document.getElementById("admin-q").value = "";
    await loadAdmin();
    document.getElementById("admin-msg").textContent =
      `Добавлен «${row.product.name}». ML предлагает: ${T.materials[row.suggestion.material]} — проверьте и подтвердите.`;
  } catch (err) {
    document.getElementById("admin-msg").textContent = `Не удалось добавить: ${err.message}`;
  }
};
document.getElementById("autobind").onclick = async () => {
  const btn = document.getElementById("autobind");
  const info = document.getElementById("admin-stats");
  btn.disabled = true;
  btn.textContent = "Привязываю… (до минуты)";
  try {
    const before = await api("/api/v1/admin/stats");
    const after = await api("/api/v1/admin/autobind", { method: "POST" });
    await loadAdmin();
    info.textContent = `Новых привязок: ${after.bound_ml - before.bound_ml}. ` + info.textContent;
  } catch (e) {
    info.textContent = `Ошибка привязки: ${e.message}`;
  } finally {
    btn.disabled = false;
    btn.textContent = "Привязать автоматически (ML)";
  }
};

api("/api/v1/taxonomy").then(t => {
  t.stages.forEach(s => T.stages[s.id] = s.title);
  t.works.forEach(w => T.works[w.id] = w.title);
  t.materials.forEach(m => T.materials[m.id] = m.title);
  t.renovation_types.forEach(r => T.renovation[r.id] = r.title);
  t.room_types.forEach(r => { ROOMS[r.id] = r.title; ROOM_OPENINGS[r.id] = [r.windows, r.doors]; });
  showStep(0);
  searchProducts();
});
</script>
